<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/resources.css" />
    <title>Helltrip TD</title>
</head>

<body>
    <div id="game-container">
        <canvas></canvas>
        <div class="resources">
            <div class="hearts"></div>
            <div class="gold"></div>
        </div>

        <p class="wave-display"></p>
        <div id="leaderboard-icon" style="position: absolute; top: 20px; right: 20px; cursor: pointer; z-index: 100;">
            <img src="https://cdn-icons-png.flaticon.com/512/3112/3112946.png" width="50" alt="Leaderboard">
        </div>

        <div id="leaderboard-modal"
            style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 20px; border: 3px solid #ffd700; border-radius: 15px; z-index: 1000; min-width: 300px; text-align: center; font-family: 'Arial', sans-serif;">
            <h2 style="color: #ffd700;">TOP 10 REKORDÓW</h2>
            <ul id="leaderboard-list" style="list-style: none; padding: 0; margin: 20px 0; font-size: 20px;"></ul>
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button onclick="document.getElementById('leaderboard-modal').style.display='none'"
                    style="background: #ffd700; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px;">
                    ZAMKNIJ
                </button>

                <button id="clear-leaderboard"
                    style="background: #ff4444; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px;">
                    WYCZYŚĆ WYNIKI
                </button>
        </div>
    </div>
    <div class="game-over">
        Game Over
        <button onclick="finishAndSave()" class="save-btn">Zapisz Wynik</button>
    </div>

    <div class="play ">
        Play<div class="play-button"></div>
    </div>
    <div class="off on"></div>
    <div class="win">
        You Won !
        <button onclick="finishAndSave()" class="save-btn">Zapisz Wynik</button>
    </div>

    </div>
    <div id="tower-menu">

        <button id="archer-tower" class="tower-options">
            <img src="media/archer.png" height="60px" width="60px">
            <div class="tower-cost">
                <p class="cost">90</p>
            </div>
        </button>

        <button id="mage-tower" class="tower-options">
            <img src="media/mage.png" height="60px" width="60px">
            <div class="tower-cost">
                <p class="cost">120</p>
            </div>
        </button>
        <button id="barracks" class="tower-options">
            <img src="media/barracks.png" height="60px" width="60px">
            <div class="tower-cost">
                <p class="cost">90</p>
            </div>
        </button>

        <button id="close-tower-menu" class="close-btn">✕</button>

    </div>

    <div id="tower-upgrade-menu" style="display: none; position: absolute;">
        <div id="upgrade-menu-header">
            <span id="tower-name-level"></span>
            <button id="close-upgrade-menu" class="close-btn">✕</button>
        </div>
        <div id="tower-stats-display">
            <p>Damage: <span id="tower-damage" class="tower-stats"></span></p>
            <p>Range: <span id="tower-range" class="tower-stats"></span></p>
            <p>Cooldown: <span id="tower-cooldown" class="tower-stats"></span></p>
        </div>
        <button id="upgrade-button"></button>
        <button id="sell-button"></button>
        <button id="rally-button" title="Set Rally Point"
            style="border-radius:50%;margin:auto; margin-top:20px; display:flex; justify-content: center; align-items:center;">
            <img src="media/rally.png" height="30px" width="30px">
        </button>
    </div>


    <script src="js/towers.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/placement.js"></script>
    <script src="js/waypoints.js"></script>
    <script src="js/classes.js"></script>
    <script src="js/script.js"></script>
    <script src="js/path.js"></script>
</body>

</html>
